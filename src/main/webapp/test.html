<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>测试新增投放点</title>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
        .notice { background: #fff3e0; padding: 15px; border-radius: 4px; margin-bottom: 20px; border-left: 5px solid #ff9800; }
        .result-area { background: #f5f5f5; padding: 15px; border-radius: 4px; border: 1px solid #ddd; white-space: pre-wrap; font-family: monospace; }
        button { padding: 10px 20px; background: #2196f3; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #1976d2; }
    </style>
    <script>
        async function testAddLocation() {
            const url = '/api/manage/locations?city=测试市&district=测试区&address=测试地址&alias=测试投放点&amount=6&bylocation=false';
            console.log('请求URL:', url);
            
            try {
                const response = await fetch(url, {
                    method: 'PUT',
                    credentials: 'include'
                });
                
                const text = await response.text();
                document.getElementById('result').textContent = text;
                
                if (text.includes('请先登录')) {
                    alert('请先在管理端登录后再试！\n地址：http://localhost:3001/login');
                }
            } catch (error) {
                console.error('请求失败:', error);
                document.getElementById('result').textContent = '请求失败: ' + error.message;
            }
        }
    </script>
</head>
<body>
    <h1>管理端 API 测试</h1>
    
    <div class="notice">
        <strong>注意：</strong> 此页面用于测试管理端 API。由于管理端开启了登录拦截，您必须先在 
        <a href="http://localhost:3001/login" target="_blank">管理端登录界面</a> 登录成功后，
        再刷新此页面发送请求，否则会提示“请先登录”。
    </div>

    <button onclick="testAddLocation()">发送测试请求 (新增投放点)</button>
    
    <h3>响应结果：</h3>
    <div id="result" class="result-area">等待请求...</div>
</body>
</html>
